name: Familie rejseoverblik - e-mailpåmindelser
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Send testmail til begge modtagere (ingen Dropbox-ændringer)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tjek frister og send e-mail
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_TEST_EMAIL: ${{ github.event.inputs.send_test_email || 'false' }}
          TZ: Europe/Copenhagen
        run: python reminders.py
