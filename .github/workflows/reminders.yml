name: Familie rejseoverblik - e-mailpåmindelser
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      test_dates:
        description: 'Test alle påmindelsesdatoer (uden e-mail og Dropbox)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tjek frister eller test datoer
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TZ: Europe/Copenhagen
          TEST_DATES: ${{ inputs.test_dates || 'false' }}
        run: |
          if [ "$TEST_DATES" = "true" ]; then
            python reminders.py --test-dates
          else
            python reminders.py
          fi
