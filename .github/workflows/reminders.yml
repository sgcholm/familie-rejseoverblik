name: Familie rejseoverblik - e-mailpåmindelser
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
    inputs:
      test_dates:
        description: 'Test alle påmindelsesdatoer (uden e-mail og Dropbox)'
        required: false
        type: boolean
        default: false
      test_reminder_email:
        description: 'Send fiktiv visumpåmindelse til min Gmail (uden Dropbox)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tjek frister eller kør test
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TZ: Europe/Copenhagen
          TEST_DATES: ${{ inputs.test_dates || 'false' }}
          TEST_REMINDER_EMAIL: ${{ inputs.test_reminder_email || 'false' }}
        run: |
          if [ "$TEST_DATES" = "true" ] && [ "$TEST_REMINDER_EMAIL" = "true" ]; then
            echo 'Vælg kun én test ad gangen.' >&2
            exit 1
          elif [ "$TEST_DATES" = "true" ]; then
            python reminders.py --test-dates
          elif [ "$TEST_REMINDER_EMAIL" = "true" ]; then
            python reminders.py --test-reminder-email
          else
            python reminders.py
          fi
